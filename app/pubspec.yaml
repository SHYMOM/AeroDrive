name: aerodrive
description: "AeroDrive — Zero-knowledge encrypted cloud storage powered by Telegram."
publish_to: 'none'
version: 0.1.0-alpha.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Local Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Cryptography
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2
  flutter_secure_storage: ^9.2.4

  # Utilities
  uuid: ^4.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  tdlib: ^1.6.0
  flutter_dotenv: ^6.0.1
  bip39: ^1.0.6
  zxcvbnm: ^1.1.1
  workmanager: ^0.9.0+3
  desktop_drop: ^0.7.1
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.7
  shelf: ^1.4.1
  image: ^4.2.0
  xml: ^7.0.1
  shelf_router: ^1.1.4
  flutter_animate: ^4.5.2
  file_selector: ^1.1.0
  local_auth: ^3.0.1
  app_links: ^7.1.2
  google_mlkit_image_labeling: ^0.14.2
  oauth2: ^2.0.5
  http: ^1.6.0
  url_launcher: ^6.3.2
  flex_color_scheme: ^8.4.0
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  archive: ^4.0.2
  google_mlkit_face_detection: ^0.13.2
  exif: ^3.3.0
  battery_plus: ^7.1.0
  crypto: ^3.0.7
  flutter_staggered_grid_view: ^0.7.0
  pdfx: ^2.9.2
  flutter_markdown: ^0.7.7+1
  flutter_widget_from_html: ^0.17.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.1
  freezed: ^2.5.7
  json_serializable: ^6.9.0

  # Linting
  flutter_lints: ^6.0.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/cities.json
    - assets/icon.png
