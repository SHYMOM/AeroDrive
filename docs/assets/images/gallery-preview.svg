      <rect x="0" y="115" width="220" height="45" rx="0 0 10 10" fill="#0F172A" fill-opacity="0.85"/>
      <text x="12" y="135" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFF">Campfire Night.dng</text>
      <text x="12" y="150" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" fill="#38BDF8">56.7 MB • EXIF Protected</text>
    </g>
