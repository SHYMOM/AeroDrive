        <rect width="135" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="67" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#38BDF8" text-anchor="middle">⚡ Zero Latency EXIF</text>

        <rect x="145" width="145" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="217" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#A78BFA" text-anchor="middle">🔒 Client Key Derivation</text>

        <rect x="300" width="165" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="382" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#34D399" text-anchor="middle">🛡️ Unlimited Original RAWs</text>
