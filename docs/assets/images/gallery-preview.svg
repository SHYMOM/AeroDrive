    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#94A3B8">On-Device TensorFlow Face Clustering • Semantic Search • Zero-Knowledge EXIF Stripping</text>
    
    <g transform="translate(680, 5)">
      <rect width="260" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="18" r="6" fill="none" stroke="#94A3B8" stroke-width="2"/>
      <line x1="25" y1="23" x2="31" y2="29" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
