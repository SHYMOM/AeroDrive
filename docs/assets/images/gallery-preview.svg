      <circle cx="36" cy="36" r="34" fill="none" stroke="#334155" stroke-width="2"/>
      <circle cx="36" cy="36" r="30" fill="#8B5CF6"/>
      <text x="36" y="42" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#FFF" text-anchor="middle">EK</text>
