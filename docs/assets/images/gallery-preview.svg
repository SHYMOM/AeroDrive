  <!-- Bottom Privacy Banner -->
  <g transform="translate(30, 480)">
    <rect width="940" height="130" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <g transform="translate(24, 25)">
      <circle cx="20" cy="20" r="18" fill="#10B981" fill-opacity="0.15"/>
      <path d="M12 20l5 5 11-11" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
      <text x="50" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">100% On-Device Neural Processing</text>
      <text x="50" y="38" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#94A3B8">Your faces, locations, tags, and embeddings never leave this device unencrypted. No cloud AI scans your private life.</text>
      
      <!-- Feature Pills -->
