    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="640" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1"/>

  <!-- Top bar -->
