      <text x="36" y="42" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#FFF" text-anchor="middle">MI</text>
      <text x="36" y="85" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC" text-anchor="middle">Milo 🐕</text>
      <text x="36" y="100" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">184 photos</text>
